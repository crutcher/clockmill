[package]
name = "flowvis"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
burn = { workspace = true, features = ["fusion", "autotune"] }
clockmill = { path = "../../crates/clockmill" }
clap = { workspace = true, features = ["derive"] }

piston = { workspace = true}
piston2d-graphics = { workspace = true}
pistoncore-glutin_window = { workspace = true}
piston2d-opengl_graphics = { workspace = true}
gl = {workspace = true}

[lints]
workspace = true

[features]
default = ["wgpu"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]
wgpu = ["burn/wgpu"]
