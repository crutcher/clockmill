[package]
name = "conway_vis"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
clockmill = { path = "../../crates/clockmill" }

burn = { workspace = true, features = ["fusion", "autotune"] }

# Bug in burn/cuda deps; pinned to force "nvrtc" for cudarc:
cudarc = { workspace = true, features = ["nvrtc"], optional = true }

clap = { workspace = true, features = ["derive"] }

piston = { workspace = true}
piston2d-graphics = { workspace = true}
pistoncore-glutin_window = { workspace = true}
piston2d-opengl_graphics = { workspace = true}
gl = {workspace = true}

indicatif = { workspace = true }

[lints]
workspace = true

[features]
default = []
cuda = ["burn/cuda", "burn/cubecl"]
metal = ["burn/metal"]
wgpu = ["burn/wgpu", "burn/cubecl"]
