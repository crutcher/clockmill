[workspace]
# Require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
edition = "2024"
version = "0.3.7"
repository = "https://github.com/crutcher/bimm"
license = "MIT"
rust-version = "1.88.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
double_must_use = "allow"
doc_markdown = "warn"


[patch.crates-io]
burn = { git = "https://github.com/tracel-ai/burn", rev = "6799d429b7307e7698109a2801acc4eccffb272c" }

[workspace.dependencies]
burn = "^0.19.0"
bimm-contracts = "^0.4.3"

indicatif = "0.18.0"

clap = "^4.5.47"

piston = "1.0.0"
piston2d-graphics = "0.45.0"
pistoncore-glutin_window = "0.72.0"
piston2d-opengl_graphics = "0.89.0"
gl = "0.14.0"
